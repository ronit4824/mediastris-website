# Include inside a server block with the real domain and TLS configuration.
# Copy frontend/dist contents to /var/www/mediastris.
root /var/www/mediastris;
index index.html;
client_max_body_size 24k;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src https://maps.google.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Overwrite visitor headers; the backend trusts only its loopback proxy.
}
location = /api/careers/apply {
    client_max_body_size 6m;
    client_body_buffer_size 6m;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:8080;
    proxy_read_timeout 35s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location /assets/ {
    expires 1y;
    try_files $uri =404;
}
location / {
    try_files $uri $uri/index.html /index.html;
}
