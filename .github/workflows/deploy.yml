name: Deploy Mediastris frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check tracked files for common secret patterns
        run: node ../scripts/check-secrets.mjs
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Install locked dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
        env:
          VITE_BASE_PATH: /mediastris-website/
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_CONTACT_PHONE: ${{ vars.VITE_CONTACT_PHONE }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          VITE_WHATSAPP_NUMBER: ${{ vars.VITE_WHATSAPP_NUMBER }}
          VITE_REVIEWS_MODE: ${{ vars.VITE_REVIEWS_MODE || 'DEMO' }}
          VITE_SHOW_DEMO_REVIEWS: 'false'
      - name: Verify Pages artifact
        run: npm run test:pages
      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy frontend
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
